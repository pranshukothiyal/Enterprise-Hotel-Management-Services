server:
    port: 8099

spring:
    application:
        name: AUTH-SERVICE

    datasource:
        url: jdbc:mysql://localhost:3306/auth_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: root
        password: Praaks@02
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        open-in-view: false
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.MySQLDialect

jwt:
    secret: ${JWT_SECRET:ThisIsOnlyALocalDevelopmentSecretKeyChangeItBeforeDeployment1234567890}
    expiration-ms: 86400000

eureka:
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: http://localhost:8761/eureka/

    instance:
        hostname: localhost
        prefer-ip-address: true
        ip-address: 127.0.0.1
        instance-id: ${spring.application.name}:${server.port}
        non-secure-port: ${server.port}
        non-secure-port-enabled: true

management:
    endpoints:
        web:
            exposure:
                include: "health,info,mappings"

    endpoint:
        health:
            show-details: always

info:
    app:
        name: Authentication Service
        description: Handles registration, login and JWT authentication
        version: 1.0.0