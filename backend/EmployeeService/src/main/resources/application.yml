server:
  port: 8087

spring:
  application:
    name: EMPLOYEE-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/employee_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "Praaks@02"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.web: INFO